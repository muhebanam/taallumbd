services:
  - type: web
    name: taallumbd-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    # Health check – Laravel responds on /up
    healthCheckPath: /up
    envVars:
      # ── Application ──────────────────────────────────────────────────────────
      - key: APP_NAME
        value: "TaallumBD"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # Render sets the service URL automatically; we mirror it here
      - key: APP_URL
        value: https://taallumbd-app.onrender.com
      - key: APP_LOCALE
        value: bn
      - key: APP_TIMEZONE
        value: Asia/Dhaka

      # ── Database (Neon PostgreSQL) ───────────────────────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── Session / Cache / Queue (Database Default, Optional Upstash Redis) ────
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: REDIS_URL
        sync: false

      # ── Storage (Local or Cloudflare R2 Free) ─────────────────────────────────
      - key: FILESYSTEM_DISK
        value: local
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_PUBLIC_BUCKET
        value: taallum-public
      - key: R2_PRIVATE_BUCKET
        value: taallum-private
      - key: R2_PUBLIC_URL
        sync: false

      # ── Logging & Monitoring (JSON Stderr + Sentry Free) ─────────────────────
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_STDERR_FORMATTER
        value: json
      - key: LOG_LEVEL
        value: warning
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.05"

      # ── Mail (Brevo / Resend Free SMTP) ──────────────────────────────────────
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        value: support@taallumbd.com
      - key: MAIL_FROM_NAME
        value: "Taallum BD"

      # ── Payments (Manual bKash/Nagad/Rocket) ──────────────────────────────────
      - key: PAYMENT_DEFAULT_GATEWAY
        value: manual
      - key: PAYMENTS_MOCK_ENABLED
        value: "false"
      - key: BKASH_MANUAL_NUMBER
        value: "01700000000"
      - key: BKASH_MANUAL_TYPE
        value: personal
      - key: NAGAD_MANUAL_NUMBER
        value: "01700000000"
      - key: NAGAD_MANUAL_TYPE
        value: personal
      - key: ROCKET_MANUAL_NUMBER
        value: "01700000000"
      - key: ROCKET_MANUAL_TYPE
        value: personal
      - key: CRON_SECRET
        generateValue: true

      # ── Automated Payment Gateways (Disabled by default, live on merchant credentials) ──
      - key: SSLCOMMERZ_ENABLED
        value: "false"
      - key: SSLCOMMERZ_MODE
        value: sandbox
      - key: SSLCOMMERZ_STORE_ID
        sync: false
      - key: SSLCOMMERZ_STORE_PASSWORD
        sync: false
      - key: BKASH_ENABLED
        value: "false"
      - key: BKASH_MODE
        value: sandbox
      - key: BKASH_APP_KEY
        sync: false
      - key: BKASH_APP_SECRET
        sync: false
      - key: BKASH_USERNAME
        sync: false
      - key: BKASH_PASSWORD
        sync: false
