services:
  - type: web
    name: taallumbd-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Health check – Laravel responds on /up
    healthCheckPath: /up
    envVars:
      # ── Application ──────────────────────────────────────────────────────────
      - key: APP_NAME
        value: "TaallumBD"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # Render sets the service URL automatically; we mirror it here
      - key: APP_URL
        value: https://taallumbd-app.onrender.com
      - key: APP_LOCALE
        value: en
      - key: APP_TIMEZONE
        value: Asia/Dhaka

      # ── Database (Neon PostgreSQL) ───────────────────────────────────────────
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: DB_SSLMODE
        value: require

      # ── Session / Cache / Queue ───────────────────────────────────────────────
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file

      # ── Storage ───────────────────────────────────────────────────────────────
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error

      # ── Mail (disable in production unless configured) ────────────────────────
      - key: MAIL_MAILER
        value: log

