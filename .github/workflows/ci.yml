name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on ${{ matrix.database }} (PHP 8.3 & Node 20)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: [postgresql, mysql]
        include:
          - database: postgresql
            db_connection: pgsql
            db_port: 5432
            db_username: postgres
            db_password: password
            db_database: taallumbd_test
          - database: mysql
            db_connection: mysql
            db_port: 3306
            db_username: root
            db_password: rootpassword
            db_database: taallumbd_test

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: taallumbd_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taallumbd_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, bcmath, zip, gd, pcntl
        tools: composer:v2
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Get Composer Cache Directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install NPM dependencies
      run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

    - name: Build frontend assets
      run: npm run build

    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: Install Composer dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Generate Application Key
      run: php artisan key:generate

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Run Pint Code Style Check
      run: vendor/bin/pint --test

    - name: Execute Tests via PHPUnit
      env:
        DB_CONNECTION: ${{ matrix.db_connection }}
        DB_HOST: 127.0.0.1
        DB_PORT: ${{ matrix.db_port }}
        DB_DATABASE: ${{ matrix.db_database }}
        DB_USERNAME: ${{ matrix.db_username }}
        DB_PASSWORD: ${{ matrix.db_password }}
      run: php artisan test

  deploy:
    name: Render Deploy & Smoke Check
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render Deploy Hook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK" || echo "Deploy hook triggered."
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not set. Render git-based autoDeploy will proceed."
          fi

      - name: Wait for Deployment & Smoke Check (/health)
        env:
          APP_URL: ${{ secrets.RENDER_APP_URL || 'https://taallumbd-app.onrender.com' }}
        run: |
          echo "Starting post-deploy smoke check for $APP_URL/health..."
          sleep 20
          SUCCESS=0
          for i in {1..8}; do
            echo "Smoke check attempt $i of 8..."
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/health" || true)
            echo "Endpoint returned HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Smoke check succeeded! Application is live and healthy."
              SUCCESS=1
              break
            fi
            sleep 15
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "::warning::Smoke check could not confirm 200 within timeout. Check Render deploy logs."
          fi
