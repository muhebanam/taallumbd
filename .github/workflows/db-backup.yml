name: Neon PostgreSQL Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC (08:00 AM Bangladesh Time)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Neon PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Dump Database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret is not set, skipping dump."
            exit 0
          fi
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="taallumbd_backup_${TIMESTAMP}.sql.gz"
          echo "Dumping database..."
          pg_dump "$DATABASE_URL" | gzip > "$BACKUP_FILE"
          echo "Backup created: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

      - name: Upload Backup to Artifacts (7 days retention)
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: taallumbd_backup_*.sql.gz
          retention-days: 7
