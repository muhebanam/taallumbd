name: Neon PostgreSQL Database Backup to Cloudflare R2

on:
  schedule:
    # Run daily at 02:00 UTC (08:00 AM Bangladesh Time)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Neon PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL Client & AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client awscli

      - name: Dump Database & Compress
        id: dump
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set, skipping dump."
            exit 0
          fi

          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="taallumbd_backup_${TIMESTAMP}.sql.gz"
          echo "filename=$BACKUP_FILE" >> $GITHUB_OUTPUT

          echo "Dumping database from Neon PostgreSQL..."
          # If pooled URL (-pooler.), convert to direct for clean schema dumping
          DIRECT_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')
          pg_dump "$DIRECT_URL" --clean --if-exists --no-owner --no-privileges | gzip > "$BACKUP_FILE"

          FILE_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
          echo "Backup successfully created: $BACKUP_FILE ($FILE_SIZE)"

      - name: Upload Backup to Cloudflare R2
        if: steps.dump.outputs.filename != '' && env.R2_SECRET_ACCESS_KEY != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BACKUP_BUCKET || secrets.R2_PRIVATE_BUCKET || 'taallum-backups' }}
          BACKUP_FILE: ${{ steps.dump.outputs.filename }}
        run: |
          echo "Uploading $BACKUP_FILE to Cloudflare R2 bucket: $R2_BUCKET..."
          aws s3 cp "$BACKUP_FILE" "s3://${R2_BUCKET}/backups/$BACKUP_FILE" --endpoint-url "$R2_ENDPOINT"
          echo "✓ Backup uploaded to R2: s3://${R2_BUCKET}/backups/$BACKUP_FILE"

      - name: Upload Backup to GitHub Artifacts (Fallback)
        if: steps.dump.outputs.filename != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.dump.outputs.filename }}
          path: taallumbd_backup_*.sql.gz
          retention-days: 7

      - name: Notify On Failure
        if: failure()
        run: |
          echo "::error::Neon PostgreSQL backup workflow failed! Please check secrets, Neon connection, and R2 credentials immediately."
