# ==============================================================================
# Taallum BD — Production Docker Compose (Single-Server VPS Deployment)
# Reference: Master Plan Part 4, 6, 14 & docs/deploy-vps.md
# ==============================================================================
# Usage:
#   1. Copy .env.example to .env.production on the VPS and set secure values
#   2. Run: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# ==============================================================================

services:
  # ─── 1. Web Application (Nginx + PHP 8.3-FPM) ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: taallumbd-app:latest
    container_name: taallum_prod_app
    restart: unless-stopped
    ports:
      # Bind to localhost so host Nginx / Caddy can proxy requests with SSL
      - "127.0.0.1:8080:80"
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-taallumbd}
      - DB_USERNAME=${DB_USERNAME:-taallum_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_change_in_production}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_change_in_production}
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taallum_prod_net

  # ─── 2. Dedicated Queue Worker (Supervisor alternative) ──────────────────────
  worker:
    image: taallumbd-app:latest
    container_name: taallum_prod_worker
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90 --max-time=3600
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-taallumbd}
      - DB_USERNAME=${DB_USERNAME:-taallum_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_change_in_production}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_change_in_production}
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taallum_prod_net

  # ─── 3. Task Scheduler ──────────────────────────────────────────────────────
  scheduler:
    image: taallumbd-app:latest
    container_name: taallum_prod_scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env.production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-taallumbd}
      - DB_USERNAME=${DB_USERNAME:-taallum_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret_change_in_production}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_change_in_production}
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - CACHE_STORE=redis
      - SESSION_DRIVER=redis
    volumes:
      - app_storage:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taallum_prod_net

  # ─── 4. Local High-Performance PostgreSQL 16 ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: taallum_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-taallumbd}
      POSTGRES_USER: ${DB_USERNAME:-taallum_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret_change_in_production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taallum_user} -d ${DB_DATABASE:-taallumbd}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taallum_prod_net

  # ─── 5. Local High-Performance Redis 7 ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: taallum_prod_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_change_in_production}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_change_in_production}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taallum_prod_net

# ─── Volumes & Networks ───────────────────────────────────────────────────────
volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  app_storage:
    driver: local

networks:
  taallum_prod_net:
    driver: bridge
